<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

      <div class="card">

        <div class="coffee-img-section">
          <img
            class="coffee-image"
            src="https://icmedianew.gumlet.io/pub/media/catalog/product/cache/7c90eecf75182456ca0a208cc3917af8/i/n/india-circus-by-krsnaa-mehta-strelizias-garden-coffee-mug-set-of-2-52152101sd01019-5.jpg"
            alt="...loading"
          />
        </div>

        <div class="coffee-content">

          <p class="product-name">COFFEE MUG</p>
          <h1>White Coffee Mug</h1>
          <p class="desc">
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Eum vero
            itaque ullam cum voluptates.
          </p>
          <span class="discounted-price">$10 <del class="original-price">$25</del></span>
          <button class="btn">🛒Add to cart</button>

        </div>
      </div>
    </div>
  </body>
</html>
