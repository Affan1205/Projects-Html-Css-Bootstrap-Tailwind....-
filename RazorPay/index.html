<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <link rel="stylesheet" href="main.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav class="bg-deepBlue">
      <div
        class="relative w-[1080px] mx-auto flex items-center justify-between"
      >
        <!-- logo -->
        <a href="/" class="cursor-pointer py-7 pr-7">
          <img src="./Images/logo.svg" width="125px" height="30px" alt="" />
        </a>

        <ul class="flex gap-6">
          <li
            class="text-white py-7 hover:text-lightBlue transition-all duration-200 relative group"
          >
            <a href="#" class="">Payments</a>
            <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue opacity-0 group-hover:opacity-100 transition-all duration-200"
            ></div>
          </li>

          <li
            class="text-white py-7 hover:text-lightBlue transition-all duration-200 relative group"
          >
            <a href="#" class="">Banking</a>
            <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue opacity-0 group-hover:opacity-100 transition-all duration-200"
            ></div>
          </li>

          <li
            class="text-white py-7 hover:text-lightBlue transition-all duration-200 relative group"
          >
            <a href="#" class="">Corporate Card</a>
          </li>

          <li
            class="text-white py-7 hover:text-lightBlue transition-all duration-200 relative group"
          >
            <a href="#" class="">Payroll</a>
          </li>

          <li
            class="text-white py-7 hover:text-lightBlue transition-all duration-200 relative group"
          >
            <a href="#" class="">Resouce</a>
            <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue opacity-0 group-hover:opacity-100 transition-all duration-200"
            ></div>
          </li>

          <li
            class="text-white py-7 hover:text-lightBlue transition-all duration-200 relative group"
          >
            <a href="#" class="">Support</a>
            <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue opacity-0 group-hover:opacity-100 transition-all duration-200"
            ></div>
          </li>

          <li
            class="text-white py-7 hover:text-lightBlue transition-all duration-200 relative group"
          >
            <a href="#" class="">Pricing</a>
            <div
              class="absolute bottom-0 w-full h-1 bg-lightBlue opacity-0 group-hover:opacity-100 transition-all duration-200"
            ></div>
          </li>
        </ul>

        <div class="flex gap-6">
          <img
            src="./Images/india-flag.svg"
            width="28px"
            height="20px"
            alt=""
          />

          <button
            class="py-3 px-5 text-white border-lightBlue border rounded-sm text-sm font-bold cursor-pointer"
          >
            Log in
          </button>

          <button
            class="py-3 px-4 bg-white text-lightBlue300 border rounded-sm text-sm font-bold transition-all duration-200 cursor-pointer hover:text-lightBlue500"
          >
            Sign Up <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </nav>
  </body>
</html>
